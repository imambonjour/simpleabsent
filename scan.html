  <style>
    /* Menggunakan font pixel untuk elemen retro */
    .font-pixel-title {
      font-family: 'Press Start 2P', cursive;
      image-rendering: pixelated;
    }

    .font-pixel-body {
      font-family: 'VT323', monospace;
      font-size: 1.35rem;
      letter-spacing: 0.5px;
    }

    body {
      margin: 0 !important;
      padding: 0 !important;
      min-height: 100vh;
    }

    /* Efek Pixel Border dan Bayangan Tebal ala Game Retro */
    .pixel-card {
      background-color: var(--bg-card);
      border: none !important;
      box-shadow: none !important;
      width: 100%;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      padding: 24px !important;
    }

    .pixel-btn {
      background-color: var(--primary-orange);
      border: 4px solid var(--border-color);
      box-shadow: 4px 4px 0px var(--border-color);
      transition: all 0.1s ease;
      cursor: pointer;
    }

    .pixel-btn:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px var(--border-color);
    }

    .pixel-btn-secondary {
      background-color: #ffffff;
      border: 4px solid var(--border-color);
      box-shadow: 4px 4px 0px var(--border-color);
      transition: all 0.1s ease;
      cursor: pointer;
    }

    .pixel-btn-secondary:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px var(--border-color);
    }

    /* Pemindai QR - Bingkai Kamera */
    .scanner-window {
      border: 4px dashed var(--border-color);
      position: relative;
      overflow: hidden;
      background-color: #1a1613;
    }

    /* Animasi Laser Pemindaian Pixel */
    .laser-line {
      position: absolute;
      width: 100%;
      height: 6px;
      background-color: #55ff55;
      box-shadow: 0 0 8px #55ff55;
      animation: scan 2s linear infinite;
      z-index: 10;
    }

    @keyframes scan {
      0% {
        top: 0%;
      }

      50% {
        top: 100%;
      }

      100% {
        top: 0%;
      }
    }

    /* Sudut-sudut Dekoratif Pixel */
    .pixel-corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border-style: solid;
      z-index: 20;
    }

    .pixel-corner.top-left {
      top: 8px;
      left: 8px;
      border-width: 4px 0 0 4px;
      border-color: var(--primary-orange);
    }

    .pixel-corner.top-right {
      top: 8px;
      right: 8px;
      border-width: 4px 4px 0 0;
      border-color: var(--primary-orange);
    }

    .pixel-corner.bottom-left {
      bottom: 8px;
      left: 8px;
      border-width: 0 0 4px 4px;
      border-color: var(--primary-orange);
    }

    .pixel-corner.bottom-right {
      bottom: 8px;
      right: 8px;
      border-width: 0 4px 4px 0;
      border-color: var(--primary-orange);
    }

    .scan-history-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-bottom: 2px solid var(--border-color);
      font-size: var(--text-sm);
    }

    .scan-history-item:last-child {
      border-bottom: none;
    }

    .scan-history-item__time {
      color: var(--warm-400);
      font-size: var(--text-xs);
      min-width: 50px;
    }

    .manual-input-group {
      display: flex;
      gap: var(--space-2);
    }

    .manual-input-group .form-input {
      flex: 1;
    }

    /* Animation pulse */
    .animate-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .5;
      }
    }
  </style>
</head>

  <!-- Scanner -->
  <div class="pixel-card">

    <!-- Label Antarmuka -->
    <div
      style="display: flex; justify-content: space-between; align-items: center; border-bottom: 4px dashed var(--border-color); padding-bottom: 12px; margin-bottom: 4px;">
      <span class="font-pixel-title text-gray-600"
        style="font-size: 10px; text-transform: uppercase; tracking-wider: 0.05em;">STASIUN PEMINDAI</span>
      <div style="display: flex; gap: 6px;">
        <span
          style="width: 14px; height: 14px; background-color: #ef4444; border: 2px solid var(--border-color); display: inline-block;"></span>
        <span id="status-yellow-dot"
          style="width: 14px; height: 14px; background-color: #facc15; border: 2px solid var(--border-color); display: inline-block;"></span>
        <span
          style="width: 14px; height: 14px; background-color: #22c55e; border: 2px solid var(--border-color); display: inline-block;"></span>
      </div>
    </div>

    <!-- Kotak Kamera / Scanner Viewport -->
    <div class="scanner-window w-full aspect-square rounded-none flex flex-col items-center justify-center relative"
      style="width: 100%; aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; background-color: #1a1613;">

      <!-- Laser Scan Effect -->
      <div id="laser" class="laser-line" style="display: none;"></div>

      <!-- Pixel Corner Accents -->
      <div class="pixel-corner top-left"></div>
      <div class="pixel-corner top-right"></div>
      <div class="pixel-corner bottom-left"></div>
      <div class="pixel-corner bottom-right"></div>

      <!-- Kamera Aktif Container -->
      <div id="scanner-reader" style="width: 100%; height: 100%;"></div>

      <!-- Overlay Pesan jika Kamera belum aktif -->
      <div id="camera-overlay"
        style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; text-align: center; background-color: #1a1613; z-index: 30;">
        <i data-lucide="camera" style="width: 48px; height: 48px; color: #6b7280; margin-bottom: 12px;"></i>
        <p class="font-pixel-body" style="font-size: 20px; color: #facc15; margin: 0 0 4px 0;">KAMERA BELUM AKTIF</p>
        <p class="font-pixel-body"
          style="font-size: 14px; color: #9ca3af; max-width: 280px; margin: 0; line-height: 1.2;">Tekan tombol "MULAI
          SCAN" di bawah untuk mengizinkan penggunaan kamera.</p>
      </div>
    </div>

    <!-- Tombol Kontrol Kamera -->
    <div style="display: flex; gap: 12px;">
      <button type="button" id="btn-start-scan"
        class="pixel-btn font-pixel-body py-2 px-4 text-lg font-bold text-[#2b2b2b] flex items-center justify-center gap-2"
        style="flex: 1; min-height: auto;">
        <span>▶ MULAI SCAN</span>
      </button>
      <button type="button" id="btn-stop-scan"
        class="pixel-btn-secondary font-pixel-body py-2 px-4 text-lg font-bold text-[#2b2b2b] flex items-center justify-center gap-2 hidden"
        style="flex: 1; min-height: auto;">
        <span>■ STOP SCAN</span>
      </button>
    </div>

    <!-- Kolom Notifikasi Kecil untuk Feedback Sukses/Tidak (Pixelated) -->
    <div id="scanner-status-box"
      style="border: 4px solid var(--border-color); background-color: white; padding: 12px; display: flex; align-items: center; justify-content: space-between; margin-top: 4px; transition: all 0.3s ease;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <!-- Indikator Status Pixelated -->
        <div id="status-pixel-dot"
          style="width: 16px; height: 16px; background-color: #9ca3af; border: 2px solid black; flex-shrink: 0;"></div>
        <div style="display: flex; flex-direction: column; text-align: left;">
          <span id="notif-title" class="font-pixel-title"
            style="font-size: 8px; color: #6b7280; text-transform: uppercase; line-height: 1; margin-bottom: 2px;">STATUS
            PEMINDAI</span>
          <span id="scanner-status" class="font-pixel-body"
            style="font-size: 16px; color: #4b5563; line-height: 1.2; font-family: 'VT323', monospace;">Tekan Mulai Scan
            untuk mengaktifkan kamera.</span>
        </div>
      </div>
      <!-- Ikon Feedback -->
      <span id="status-icon" class="font-pixel-title" style="font-size: 18px;">🤖</span>
    </div>

  </div>
