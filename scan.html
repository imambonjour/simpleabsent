<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Scanner QR — Panitia scan QR siswa untuk distribusi konsumsi acara perpisahan.">
  <title>Scanner QR — QR Konsumsi</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- QR Scanner Library -->
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    /* Scanner-specific styles */
    #scanner-reader {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }
    #scanner-reader video {
      border-radius: var(--radius-lg) !important;
    }
    #scanner-reader__scan_region {
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    /* Hide html5-qrcode default UI elements */
    #scanner-reader__dashboard_section {
      display: none !important;
    }
    #scanner-reader__header_message {
      display: none !important;
    }
    #scanner-reader img[alt="Info icon"] {
      display: none !important;
    }

    .scan-history-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-2) var(--space-3);
      border-bottom: 0.5px solid var(--border-color);
      font-size: var(--text-sm);
    }

    .scan-history-item:last-child {
      border-bottom: none;
    }

    .scan-history-item__time {
      color: var(--warm-400);
      font-size: var(--text-xs);
      min-width: 50px;
    }

    .manual-input-group {
      display: flex;
      gap: var(--space-2);
    }

    .manual-input-group .form-input {
      flex: 1;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav__inner">
      <a href="index.html" class="nav__brand" id="nav-brand"><i data-lucide="graduation-cap"></i> QR Konsumsi</a>
      <ul class="nav__links">
        <li><a href="index.html" class="nav__link" id="nav-home">Siswa</a></li>
        <li><a href="scan.html" class="nav__link nav__link--active" id="nav-scan">Scan</a></li>
        <li><a href="admin.html" class="nav__link" id="nav-admin">Admin</a></li>
      </ul>
    </div>
  </nav>

  <main class="page-wrapper" style="padding-top: 80px;">
    <div class="container" style="max-width: 500px;">

      <!-- Header -->
      <header class="header">
        <div class="header__icon" aria-hidden="true"><i data-lucide="camera"></i></div>
        <h1 class="header__title">Scanner QR</h1>
        <p class="header__subtitle">Arahkan kamera ke QR code siswa</p>
      </header>

      <!-- Stats Bar -->
      <div class="stats-grid mb-6" style="grid-template-columns: repeat(3, 1fr);">
        <div class="stat-card">
          <div class="stat-card__value" style="color: var(--success-icon);" id="scan-count">0</div>
          <div class="stat-card__label">Discan</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__value text-espresso" id="scan-total">0</div>
          <div class="stat-card__label">Total</div>
        </div>
        <div class="stat-card">
          <div class="stat-card__value text-accent" id="scan-percent">0%</div>
          <div class="stat-card__label">Progress</div>
        </div>
      </div>

      <!-- Scanner -->
      <div class="card mb-6">
        <div id="scanner-status" class="scanner-status scanner-status--info mb-4">
          Tekan Mulai Scan untuk mengaktifkan kamera.
        </div>

        <div class="scanner-viewport" id="scanner-viewport">
          <div id="scanner-reader"></div>
        </div>

        <!-- Scanner controls -->
        <div class="flex justify-center gap-3 mt-4">
          <button type="button" id="btn-start-scan" class="btn btn--primary btn--sm">
            <i data-lucide="camera"></i> Mulai Scan
          </button>
          <button type="button" id="btn-stop-scan" class="btn btn--outline btn--sm hidden">
            <i data-lucide="square"></i> Stop
          </button>
        </div>
      </div>

      <!-- Scan Result (appears after scan) -->
      <div id="scan-result-container" class="mb-6 hidden"></div>

      <!-- Manual Input (fallback) -->
      <div class="card mb-6">
        <h4 class="mb-4" style="display: flex; align-items: center; gap: 6px;"><i data-lucide="keyboard" style="width: 18px; height: 18px;"></i> Input Manual</h4>
        <p style="font-size: var(--text-xs); color: var(--warm-400); margin-bottom: var(--space-2);">
          Gunakan ini jika kamera tidak bisa membaca QR code
        </p>
        <div class="manual-input-group">
          <input 
            type="text" 
            id="manual-token" 
            class="form-input" 
            placeholder="Ketik ID Siswa atau Token..."
            autocomplete="off"
          >
          <button type="button" id="btn-manual-check" class="btn btn--primary btn--sm">
            Cek
          </button>
        </div>
      </div>

      <!-- Scan History -->
      <div class="card">
        <div class="flex justify-between items-center mb-4">
          <h4 style="display: flex; align-items: center; gap: 6px;"><i data-lucide="clipboard-list" style="width: 18px; height: 18px;"></i> Riwayat Scan</h4>
          <button type="button" id="btn-clear-history" class="btn btn--ghost btn--sm">Bersihkan</button>
        </div>
        <div id="scan-history">
          <div class="empty-state" style="padding: var(--space-4);">
            <div class="empty-state__icon" aria-hidden="true"><i data-lucide="clipboard-list"></i></div>
            <div class="empty-state__text" style="font-size: var(--text-sm);">Belum ada scan</div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Scripts -->
  <script src="js/env.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/scanner.js"></script>
</body>
</html>
