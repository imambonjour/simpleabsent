<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Tricatur Bimantara - Form absensi sederhana angkatan 34.">
  <title>Tricatur Bimantara - Absensi Angkatan 34</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body>

  <main class="page-wrapper">
    <div class="container container--narrow">

      <header class="header">
        <h1 class="header__title">
          <span class="hero__number">34</span>
          <span class="hero__cohort">Tricatur Bimantara</span>
        </h1>
        <p class="header__subtitle">Pilih kelas, lalu pilih namamu untuk melakukan absensi.</p>
      </header>

      <section id="setup-notice" class="setup-notice hidden" aria-label="Setup Supabase">
        <div class="setup-notice__icon" aria-hidden="true"><i data-lucide="settings"></i></div>
        <div>
          <h2 class="setup-notice__title">Placeholder setup Supabase</h2>
          <p class="setup-notice__text">Isi file <code>.env</code> dari <code>.env.example</code>, lalu jalankan
            <code>node scripts/generate-env.mjs</code>.
          </p>
        </div>
      </section>

      <section class="card">
        <form id="absent-form" novalidate>
          <div class="form-group">
            <label for="input-class" class="form-label">Kelas</label>
            <select id="input-class" class="form-input" required>
              <option value="" disabled selected>Pilih kelas...</option>
              <option value="10A">10A</option>
              <option value="10B">10B</option>
              <option value="10C">10C</option>
              <option value="10D">10D</option>
              <option value="10E">10E</option>
              <option value="10F">10F</option>
              <option value="10G">10G</option>
              <option value="10H">10H</option>
            </select>
          </div>

          <div class="form-group">
            <label for="input-name" class="form-label">Nama</label>
            <select id="input-name" class="form-input" required disabled>
              <option value="" disabled selected>Pilih nama...</option>
            </select>
          </div>

          <button type="submit" id="btn-submit-absent" class="btn btn--primary btn--full btn--lg mt-4">
            <i data-lucide="check-circle"></i>
            <span>Absen Sekarang</span>
          </button>
        </form>

        <div id="absent-error" class="form-error" role="alert" aria-live="polite"></div>

        <div id="success-section" class="hidden mt-6" style="text-align: center;">
          <div style="font-size: 3rem; color: var(--success-icon); margin-bottom: var(--space-2);">✓</div>
          <h3 style="color: var(--success-text);">Absensi Berhasil!</h3>
          <p id="success-detail" style="color: var(--text-muted); margin-bottom: var(--space-4);"></p>
          <button type="button" id="btn-add-another" class="btn btn--outline">
            <i data-lucide="user-plus"></i>
            <span>Absen Lagi</span>
          </button>
        </div>
      </section>

    </div>
  </main>

  <nav class="nav">
    <div class="nav__inner">
      <a href="/" class="nav__brand">
        <i data-lucide="qr-code"></i>
        QR Absensi
      </a>
    </div>
  </nav>

  <script src="js/supabase-config.js"></script>
  <script src="js/student.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>

</html>
